<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Skallstuggu</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="booking-editor.css?v=20260917-1">
  <style>
    body{background:#f6f3ee;margin:0}.logo img{height:58px;width:auto;display:block}.admin-top-menu{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08);position:sticky;top:0;z-index:110;padding:14px 0;margin-bottom:20px;border-bottom:1px solid #eee}.menu-container{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;position:relative}.menu-left,.menu-right,.menu-tabs{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.admin-tab{padding:12px 24px;background:#f3f0eb;color:#333;border-radius:10px;text-decoration:none;font-weight:500}.admin-tab.active{background:#8B4A2B;color:#fff}.logout-btn{padding:12px 22px;background:#d32f2f;color:#fff;border:0;border-radius:10px;cursor:pointer}.admin-hamburger{display:none;font-size:1.8rem;cursor:pointer}.admin-page-wrap{max-width:1200px;margin:0 auto;padding:0 15px 40px}.admin-main-grid{display:grid;grid-template-columns:1fr;gap:24px;align-items:start}@media(min-width:980px){.admin-main-grid{grid-template-columns:1.1fr .9fr}}.left-column,.right-column{display:flex;flex-direction:column;gap:24px}.admin-card,.search-panel{background:#fff;border-radius:18px;box-shadow:0 4px 20px rgba(0,0,0,.07);padding:22px}.search-panel{background:#fffaf3;border:1px solid #eadfce;border-left:5px solid #8B4A2B}.search-panel h3,.admin-card h2{margin-top:0}.search-panel p{color:#6a625b}#search{width:100%;padding:14px 16px;border:1px solid #d6cfc6;border-radius:12px;font-size:1em;box-sizing:border-box}.section-header{cursor:pointer;margin:22px 0 12px;padding:12px 14px;background:#f5f1eb;border-radius:12px}.hidden{display:none}.menu{padding:16px;border-radius:12px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}.customer-message{background:#e3f2fd;padding:12px;border-left:5px solid #2196F3;margin:12px 0;border-radius:8px}.contact-link{color:#1976d2}.warning{color:#d32f2f;font-weight:bold;background:#ffebee;padding:10px;border-radius:8px;margin:10px 0}.calendar-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin-bottom:18px}.calendar-nav button{padding:10px 16px;border:0;border-radius:10px;background:#8B4A2B;color:#fff;cursor:pointer}.calendar-nav button:last-child{justify-self:end}#monthTitle{text-align:center}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{padding:10px 4px;text-align:center;border-radius:10px;background:#e8f5e9;border:1px solid #ddd;min-height:58px;display:flex;align-items:center;justify-content:center}.booked{background:#ffcdd2}.half-start{background:linear-gradient(to right,#e8f5e9 50%,#ffcdd2 50%)}.half-end{background:linear-gradient(to right,#ffcdd2 50%,#e8f5e9 50%)}.highlight{border:3px solid #1976d2}.password-screen{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;box-sizing:border-box}.password-box{background:#fff;padding:38px 30px;border-radius:16px;text-align:center;max-width:380px;width:100%}.password-input{padding:12px;width:100%;font-size:1.05em;margin:15px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}.login-btn{padding:12px 30px;font-size:1.05em;border:0;border-radius:10px;background:#8B4A2B;color:#fff;cursor:pointer}@media(max-width:900px){.menu-tabs{display:none;flex-direction:column;position:absolute;top:100%;left:0;width:100%;background:#fff;padding:20px;box-sizing:border-box}.menu-tabs.active{display:flex}.admin-hamburger{display:block}.menu-tabs .admin-tab{width:100%;text-align:center;box-sizing:border-box}}@media(max-width:640px){.admin-card,.search-panel{padding:18px}.calendar-grid{gap:6px}.day{min-height:48px;font-size:.8em}.calendar-nav{grid-template-columns:1fr;justify-items:center}.calendar-nav button:last-child{justify-self:center}}
  </style>
</head>
<body>
  <div id="passwordScreen" class="password-screen"><div class="password-box"><h2>Admin tilgang</h2><p>Skriv inn admin-koden:</p><input type="password" id="adminPassword" class="password-input" placeholder="Skriv kode her..."><button onclick="checkPassword()" class="login-btn">Logg inn</button><p id="passwordError" style="color:red;margin-top:12px"></p></div></div>
  <div class="admin-top-menu"><div class="menu-container"><div class="menu-left"><div class="logo"><img src="images/logo.png" alt="Skallstuggu"></div><nav class="menu-tabs" id="adminNavLinks"><a href="admin.html" class="admin-tab active">Bookinger</a><a href="administrasjon.html" class="admin-tab">Administrasjon</a><a href="priser.html" class="admin-tab">Priser</a><a href="overview.html" class="admin-tab">Oversikt</a></nav></div><div class="menu-right"><button onclick="logoutAdmin()" class="logout-btn">Logg ut</button><div class="admin-hamburger" id="adminHamburger">☰</div></div></div></div>
  <section class="page" id="adminContent" style="display:none"><div class="admin-page-wrap"><div class="admin-main-grid"><div class="left-column"><div class="search-panel"><h3>Søk bookinger</h3><p>Søk etter navn, e-post eller telefon.</p><input id="search" placeholder="Søk bookinger..."></div><div class="admin-card"><h2>Bookingoversikt</h2><h3 class="section-header" onclick="toggle('foresporsler')">📩 Forespørsler</h3><div id="foresporsler"></div><h3 class="section-header" onclick="toggle('godkjente')">🏡 Kommende bookinger</h3><div id="godkjente"></div><h3 class="section-header" onclick="toggle('avslatte')">❌ Avslåtte</h3><div id="avslatte" class="hidden"></div></div></div><div class="right-column"><div class="admin-card"><h2>Kalender</h2><div class="calendar-nav"><button onclick="changeMonth(-1)">← Forrige måned</button><h3 id="monthTitle"></h3><button onclick="changeMonth(1)">Neste måned →</button></div><div class="calendar-grid" id="calendar"></div></div></div></div></div></section>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=20260913-2"></script>
  <script src="booking-editor.js?v=20260917-2"></script>
  <script src="admin.js?v=20260917-1"></script>
  <script src="overlap-fix.js?v=20260913-1"></script>
  <script src="manual-booking.js?v=season1"></script>
  <script type="module" src="booking-pricing.js?v=season1"></script>
  <script>
    function checkPassword(){const input=document.getElementById('adminPassword').value.trim(),error=document.getElementById('passwordError');if(input===ADMIN_CONFIG.password){localStorage.setItem('adminLoggedIn','true');document.getElementById('passwordScreen').style.display='none';document.getElementById('adminContent').style.display='block'}else{error.textContent='Feil kode. Prøv igjen.';document.getElementById('adminPassword').value=''}}
    function checkIfAlreadyLoggedIn(){if(localStorage.getItem('adminLoggedIn')==='true'){document.getElementById('passwordScreen').style.display='none';document.getElementById('adminContent').style.display='block'}}
    function logoutAdmin(){if(confirm('Vil du logge ut fra admin?')){localStorage.removeItem('adminLoggedIn');location.reload()}}
    window.addEventListener('load',checkIfAlreadyLoggedIn);document.getElementById('adminPassword').addEventListener('keypress',e=>{if(e.key==='Enter')checkPassword()});const adminHamburger=document.getElementById('adminHamburger'),adminNavLinks=document.getElementById('adminNavLinks');if(adminHamburger&&adminNavLinks)adminHamburger.addEventListener('click',()=>adminNavLinks.classList.toggle('active'));
  </script>
</body>
</html>

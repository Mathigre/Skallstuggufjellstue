<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skallstuggu lokal kvitteringsleser</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>Lokal kvitteringsleser</h1>
    <p>Bilaget behandles i nettleseren. Bare den leste teksten returneres til adminskjemaet.</p>
    <p><a href="https://github.com/Mathigre/Skallstuggufjellstue/tree/main/admin/scribe-scanner" target="_blank" rel="noopener">Kildekode og lisens</a></p>
    <label for="file">Velg et bilde eller en PDF for test</label>
    <input id="file" type="file" accept="image/png,image/jpeg,application/pdf">
    <button id="scan" type="button">Les kvittering</button>
    <p id="status" role="status" aria-live="polite"></p>
    <textarea id="text" rows="18" aria-label="Lest tekst"></textarea>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
